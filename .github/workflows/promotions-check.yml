name: Promotions checks

on:
  push:
    branches:
      - feature/promotions-commerce-hierarchy
  pull_request:
    paths:
      - 'wikonomi/promotions/**'
      - 'wikonomi/core/templates/**'
      - 'wikonomi/wikonomi/settings.py'
      - 'wikonomi/wikonomi/urls.py'
      - '.github/workflows/promotions-check.yml'
  workflow_dispatch:

jobs:
  django-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wikonomi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wikonomi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DEBUG: 'True'
      SECRET_KEY: ci-promotions-check
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wikonomi_test
      PROMOTIONS_ENABLED: 'True'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: wikonomi
        run: python manage.py check

      - name: Check migration drift
        working-directory: wikonomi
        run: python manage.py makemigrations --check --dry-run

      - name: Run promotion tests
        working-directory: wikonomi
        run: python manage.py test promotions --verbosity 2
