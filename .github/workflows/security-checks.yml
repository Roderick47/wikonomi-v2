name: Security checks

on:
  push:
    branches:
      - main
      - security/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-security-key-not-for-production
      DJANGO_SETTINGS_MODULE: wikonomi.production
      DEBUG: 'False'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip pip-audit

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Reject tracked SQLite databases and backups
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/).*\.sqlite3([.-].*)?(\.bak)?$|(^|/)db\.sqlite3.*' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked SQLite database material found:"
            echo "$tracked"
            exit 1
          fi

      - name: Compile Python
        run: python -m compileall -q wikonomi

      - name: Django deployment checks
        working-directory: wikonomi
        run: python manage.py check --deploy --fail-level ERROR

      - name: Security regression tests
        working-directory: wikonomi
        env:
          DJANGO_SETTINGS_MODULE: wikonomi.test_settings
          DEBUG: 'True'
        run: python manage.py test transport_index.tests.WhatsAppWebhookTests wikonomi.test_security_headers --verbosity 2

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
